<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url(space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:'Space Grotesk';font-weight:600;src:url(space-grotesk-latin-600-normal.woff2)}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:'Inter';font-weight:400;src:url(inter-latin-400-normal.woff2)}
@font-face{font-family:'Inter';font-weight:500;src:url(inter-latin-500-normal.woff2)}
@font-face{font-family:'Inter';font-weight:600;src:url(inter-latin-600-normal.woff2)}
:root{--paper:#F7F4EE;--ink:#14141A;--coral:#FF4522;--teal:#12B3A0;--rail:#17171A}
*{box-sizing:border-box;margin:0;padding:0}
body{width:6480px;height:1920px;overflow:hidden;position:relative;font-family:Inter,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,#F6F5F3 0%,#EFEEEB 62%,#E7E5E1 100%)}
/* the wall: faint panel seams like the shop's white cubby wall, and the floor's shade */
.seam{position:absolute;top:0;bottom:0;width:2px;background:rgba(20,20,26,.045)}
.floor{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,rgba(20,20,26,0),rgba(20,20,26,.07))}
/* the rail, with its posts up to the ceiling */
.rail{position:absolute;left:-40px;right:-40px;top:148px;height:20px;border-radius:10px;background:linear-gradient(180deg,#2c2c31,#101013 70%);box-shadow:0 14px 22px rgba(20,20,26,.16)}
.post{position:absolute;top:-10px;height:170px;width:18px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#101013,#2c2c31 60%,#101013);}
.post:after{content:"";position:absolute;left:-10px;right:-10px;bottom:-14px;height:34px;border-radius:8px;background:#101013}
/* anything hung: a point on the rail, a string, the thing */
.hang{position:absolute;top:158px;width:0;height:0;transform-origin:0 0}
.hook{position:absolute;left:-13px;top:-22px;width:26px;height:34px;border:5px solid #101013;border-bottom-color:transparent;border-radius:14px 14px 10px 10px}
.string{position:absolute;left:-1.5px;top:8px;width:3px;background:#2a2a2e;border-radius:2px}
.item{position:absolute;transform:translateX(-50%)}
/* the swing tag */
.tagw{filter:drop-shadow(0 18px 26px rgba(20,20,26,.16)) drop-shadow(0 2px 3px rgba(20,20,26,.10))}
.tag{position:relative;background:var(--paper);clip-path:polygon(34px 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%,0 34px);border-radius:0 0 12px 12px;padding:74px 46px 34px}
.tag .eye{position:absolute;top:20px;left:50%;margin-left:-13px;width:26px;height:26px;border-radius:50%;background:#E9E7E3;box-shadow:inset 0 0 0 5px #9a958c, inset 0 4px 5px 5px rgba(0,0,0,.18)}
.tag h1{font-family:'Space Grotesk';font-weight:700;font-size:82px;line-height:.98;letter-spacing:-.035em}
.tag h1 em{font-style:normal;color:var(--coral)}
.tag p{font-size:30px;line-height:1.3;margin-top:20px;color:rgba(20,20,26,.66);font-weight:500}
.tag .foot{display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(20,20,26,.14);margin-top:30px;padding-top:16px;font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:.34em}
.tag .foot span:last-child{letter-spacing:.08em;font-weight:600;color:rgba(20,20,26,.5)}
.tag.dark{background:#17171A;color:#F5F5F7}.tag.dark p{color:rgba(245,245,247,.66)}.tag.dark .foot{border-color:rgba(245,245,247,.2)}.tag.dark .foot span:last-child{color:rgba(245,245,247,.5)}
.tag.dark .eye{background:#EFEEEB}
/* the phone */
.phone{border:15px solid #151518;border-radius:78px;background:#151518;overflow:hidden;box-shadow:0 60px 90px rgba(20,20,26,.22),0 12px 24px rgba(20,20,26,.14), inset 0 0 0 2px #3a3a40;position:relative}
.phone img{display:block;width:100%;border-radius:63px}
.phone .cut{overflow:hidden;border-radius:63px}
.clip{position:absolute;left:50%;top:-30px;margin-left:-46px;width:92px;height:44px;border-radius:10px;background:linear-gradient(180deg,#2c2c31,#101013);box-shadow:0 6px 10px rgba(0,0,0,.25)}
/* a photo card cut from the app (a section tile, a piece) */
.card{border-radius:44px;overflow:hidden;box-shadow:0 34px 50px rgba(20,20,26,.2),0 4px 10px rgba(20,20,26,.12);border:10px solid var(--paper);background:var(--paper)}
.card .eye{position:absolute;top:22px;left:50%;margin-left:-13px;width:26px;height:26px;border-radius:50%;background:#EFEEEB;box-shadow:inset 0 0 0 5px #9a958c;z-index:2}
.card div{background-repeat:no-repeat}
/* the round sticker from the shop's posts */
.sticker{position:absolute;width:230px;height:230px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;text-align:center;font-family:'Space Grotesk';font-weight:700;font-size:44px;line-height:1;transform:rotate(12deg);box-shadow:0 16px 26px rgba(255,69,34,.32)}
.sticker:before{content:"";position:absolute;inset:12px;border-radius:50%;border:3px dashed rgba(255,255,255,.85)}
.sticker.teal{background:var(--teal);color:#062420;box-shadow:0 16px 26px rgba(18,179,160,.3)}.sticker.teal:before{border-color:rgba(6,36,32,.6)}
.sticker.ink{background:#17171A;box-shadow:0 16px 26px rgba(20,20,26,.3)}
.no{position:absolute;font-family:'Space Grotesk';font-weight:700;font-size:26px;letter-spacing:.3em;color:rgba(20,20,26,.28)}
</style></head><body>
<script>
const F = 1080, RAIL = 158;
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
for (let x = 360; x < 6480; x += 720) document.body.appendChild(el(`<div class="seam" style="left:${x}px"></div>`));
document.body.appendChild(el('<div class="floor"></div>'));
// hang(x, length of string, tilt, html, z)
function hang(x, len, rot, html, z = 2, hook = true) {
  const h = el(`<div class="hang" style="left:${x}px;transform:rotate(${rot}deg);z-index:${z}">${hook ? '<div class="hook"></div>' : ''}<div class="string" style="height:${len}px"></div><div class="item" style="top:${len}px">${html}</div></div>`);
  document.body.appendChild(h); return h;
}
const tag = (w, h1, p, n, dark) => `<div class="tagw"><div class="tag ${dark ? 'dark' : ''}" style="width:${w}px"><i class="eye"></i><h1>${h1}</h1>${p ? `<p>${p}</p>` : ''}<div class="foot"><span>KANAAN</span><span>${n}</span></div></div></div>`;
// a phone: w = screen width, src, crop = visible height of the screen (px of the frame), top = px of the capture to skip (in screen px)
const phone = (w, src, crop, top = 0) => `<div style="position:relative"><div class="phone" style="width:${w + 30}px"><div class="cut" style="height:${crop}px"><img src="raw/${src}.png" style="margin-top:${-top}px"></div></div><i class="clip"></i></div>`;
// a card cut from a capture: region x,y,w,h in capture px (1236 wide), shown at scale s
const card = (src, x, y, w, h, s) => `<div style="position:relative"><div class="card"><div style="width:${w * s}px;height:${h * s}px;background-image:url(raw/${src}.png);background-size:${1236 * s}px auto;background-position:${-x * s}px ${-y * s}px"></div></div></div>`;
const sticker = (x, y, txt, cls = '', rot = 12, z = 6) => document.body.appendChild(el(`<div class="sticker ${cls}" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);z-index:${z}"><span>${txt}</span></div>`));
const post = (x) => document.body.appendChild(el(`<div class="post" style="left:${x - 9}px;z-index:1"></div>`));

/* ---- 1. home ---- */
hang(330, 96, -2.2, tag(560, 'New pieces,<br>the day<br>they <em>land.</em>', 'Menswear from Saida, in your pocket.', 'N° 1 / 6'), 4);
hang(650, 590, 1.5, phone(690, '30-home-yours', 1420), 3);
sticker(838, 1500, 'New<br>in', '', 12);
/* ---- 2. walk in ---- */
hang(F + 610, 96, 1.8, tag(600, 'Walk the shop<br>from your<br>phone.', 'Knitwear, jackets, jeans, shoes. Every section, with what just arrived.', 'N° 2 / 6'), 4);
hang(F + 420, 640, -1.6, phone(650, '02-walk-in', 1400), 3);
// a section tile lifted out of the screen, swinging over the edge into the next picture
hang(F + 930, 1130, 3.4, card('02-walk-in', 44, 972, 564, 690, .72), 5);
/* ---- 3. a piece ---- */
hang(2 * F + 680, 96, -1.6, tag(540, 'See it<br>properly<br>first.', 'Real photos of every colour, and the sizes still left.', 'N° 3 / 6'), 4);
hang(2 * F + 560, 600, 1.4, phone(690, '10-product', 1420), 3);
sticker(2 * F + 760, 1330, 'Real<br>photos', 'ink', -10);
/* ---- 4. size ---- */
hang(3 * F + 330, 96, 2, tag(540, 'Your size.<br><em>One tap.</em>', 'See what\'s left before it\'s gone.', 'N° 4 / 6'), 4);
hang(3 * F + 630, 520, -1.3, phone(540, '20b-size-picked', 1199.3), 3);
/* ---- 5. filters ---- */
hang(4 * F + 650, 96, -2, tag(590, 'Find your<br>pair fast.', 'Filter by size, colour and price. Only what\'s in stock.', 'N° 5 / 6'), 4);
hang(4 * F + 440, 560, 1.6, phone(690, '40-shoes', 1420), 3);
sticker(4 * F + 800, 1210, 'In<br>stock', 'teal', 10);
/* ---- 6. delivery ---- */
hang(5 * F + 340, 96, 1.6, tag(590, 'To your door,<br>all over<br>Lebanon.', '$5 delivery, $3 in Saida. Pay cash when it arrives.', 'N° 6 / 6', true), 4);
hang(5 * F + 620, 600, -1.4, phone(690, '80-checkout', 1420), 3);

[540, 2700, 4860].forEach(post);
document.body.appendChild(el('<div class="rail" style="z-index:2"></div>'));
</script>
</body></html>
