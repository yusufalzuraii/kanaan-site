    <style>
      html, body { margin: 0; height: 100%; background: #F2F2F4; }

      .splash { position: fixed; inset: 0; display: grid; place-items: center; align-content: center; gap: 22px; background: radial-gradient(70% 50% at 10% 0%, rgba(255,69,34,.16), transparent 60%), radial-gradient(60% 50% at 100% 100%, rgba(18,179,160,.14), transparent 60%), #F2F2F4; color: #14141A; }

      .splash-bar { width: 64px; height: 3px; border-radius: 3px; background: rgba(20,20,26,.1); overflow: hidden; }
      .splash-bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #FF4522; animation: splash-go 1.1s ease-in-out infinite; }
      @keyframes splash-go { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-color-scheme: dark) { .splash { background: radial-gradient(70% 50% at 10% 0%, rgba(255,69,34,.22), transparent 60%), radial-gradient(60% 50% at 100% 100%, rgba(18,179,160,.18), transparent 60%), #0B0B0E; color: #F5F5F7; } .splash-bar { background: rgba(255,255,255,.12); } }
      :root[data-theme="light"] .splash { background: radial-gradient(70% 50% at 10% 0%, rgba(255,69,34,.16), transparent 60%), radial-gradient(60% 50% at 100% 100%, rgba(18,179,160,.14), transparent 60%), #F2F2F4; color: #14141A; }
      :root[data-theme="dark"] .splash { background: radial-gradient(70% 50% at 10% 0%, rgba(255,69,34,.22), transparent 60%), radial-gradient(60% 50% at 100% 100%, rgba(18,179,160,.18), transparent 60%), #0B0B0E; color: #F5F5F7; }
      .splash-note { margin: 0; max-width: 260px; text-align: center; font: 500 13.5px/1.45 Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; opacity: .6; }
      @media (prefers-reduced-motion: reduce) { .splash-bar i { animation: none; width: 100%; } }
