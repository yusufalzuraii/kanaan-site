<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Some Android browsers (Samsung Internet's "Dark mode for websites",
         Chrome's auto-dark heuristic) apply their own dark filter on top of
         any page that doesn't explicitly declare which colour schemes it
         supports — even when the site has its own light/dark toggle and the
         person picked light. This tells the browser the page is themed
         itself, so it leaves our colours alone. The default here is "light"
         because that's the app's default theme; the in-app toggle handles
         the rest via the CSS rule in App.jsx's GlobalStyles.

         This is set on <html> itself, inline, so it's present from the very
         first paint — before the JS bundle loads and React attaches
         data-theme to anything. Belt and braces: some Android browsers
         decide whether to force-dark a page early, before the app has had
         a chance to mount. A bare @media query is also declared so any
         browser that only checks for "does this page mention
         prefers-color-scheme at all" sees that it does. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F2F2F4" />
    <style>
      html { color-scheme: light; background-color: #F2F2F4; }
      @media (prefers-color-scheme: dark) { html { color-scheme: light dark; } }
    </style>
    <!-- Fonts are self-hosted, not pulled from Google's CDN.
         Why: the Android/iOS app ships its own copy of this page and runs
         from local storage, so a CDN request is a network dependency the
         app doesn't otherwise have. With remote fonts, opening the app on a
         weak connection (or offline) fell back to the system font and the
         whole brand identity broke on first paint. Latin subsets only —
         all six weights together are ~120 KB, cached forever after the
         first load, and available instantly offline.
         The two weights used above the fold are preloaded so text renders
         branded from the very first frame instead of swapping in late. -->
    <link rel="preload" href="/fonts/space-grotesk-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/space-grotesk-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/space-grotesk-latin-600-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/space-grotesk-latin-700-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/inter-latin-400-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 500; font-display: swap; src: url('/fonts/inter-latin-500-normal.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 600; font-display: swap; src: url('/fonts/inter-latin-600-normal.woff2') format('woff2'); }
    </style>
    <title>Kanaan Shop — Menswear from Saida, Lebanon</title>
    <meta name="description" content="Kanaan Shop: menswear in heavy fabrics and thoughtful cuts, from Saida to all of Lebanon. T-Shirts, Shirts, Jeans, Pants, Shorts, Sets, Underwear, Shoes, Slippers, Accessories. Cash on delivery." />
    <link rel="canonical" href="https://kanaanshop.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanaan Shop" />
    <meta property="og:title" content="Kanaan Shop — Menswear from Saida, Lebanon" />
    <meta property="og:description" content="Menswear in heavy fabrics and thoughtful cuts, from Saida to all of Lebanon. Cash on delivery." />
    <meta property="og:url" content="https://kanaanshop.com/" />
    <meta property="og:image" content="https://kanaanshop.com/logo-full.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Kanaan Shop — Menswear from Saida, Lebanon" />
    <meta name="twitter:description" content="Menswear in heavy fabrics and thoughtful cuts, from Saida to all of Lebanon." />

    <!-- Tells Google this website IS the Kanaan Shop business (the same
         one that shows up on Google Maps) and links out to the shop's own
         social profiles — this is what a Knowledge Panel / rich local
         result is built from. -->
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"ClothingStore","name":"Kanaan Shop","url":"https://kanaanshop.com","logo":"https://kanaanshop.com/logo-compact.png","image":"https://kanaanshop.com/logo-full.png","description":"Menswear in heavy fabrics and thoughtful cuts, from Saida to all of Lebanon.","address":{"@type":"PostalAddress","addressLocality":"Saida","addressCountry":"LB"},"areaServed":{"@type":"Country","name":"Lebanon"},"sameAs":["https://www.instagram.com/kanaan.shop"]}</script>
    <script>
      /* Applies the saved theme before the first pixel is painted.
         Without this, a visitor who chose dark would see a flash of the
         light background on every load while the app booted — the theme
         only exists in JavaScript, and JavaScript runs after paint. */
      (function () {
        try {
          var t = localStorage.getItem("kanaan-theme");
          if (t !== "dark" && t !== "light") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          var d = document.documentElement;
          d.style.colorScheme = t;
          d.style.background = t === "dark" ? "#0B0B0E" : "#F2F2F4";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", t === "dark" ? "#0B0B0E" : "#F2F2F4");
        } catch (e) { /* private mode — light default is fine */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
