name: Build Android APK

# بيشتغل تلقائياً كل ما توصل تحديثات لـ main، وكمان فيك تشغّله يدوياً
# من تبويب Actions بصفحة الريبو (زر "Run workflow")
on:
  push:
    branches: [main]
    paths:
      - 'kanaan-shop-v3-admin/kanaan-site/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'رقم الإصدار (versionCode) — لازم يكون أكبر من آخر رقم رفعتو على Google Play. أول إطلاق = 1، وبعدها 2، 3...'
        required: true
        default: '1'
      version_name:
        description: 'اسم الإصدار يلي بيشوفو الزبون (versionName) — مثلاً 1.0 أو 1.1'
        required: true
        default: '1.0'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanaan-shop-v3-admin/kanaan-site

    steps:
      - name: تنزيل الكود
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تجهيز Java (لازم لبناء أندرويد)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تجهيز Android SDK
        uses: android-actions/setup-android@v3

      - name: تثبيت حزم المشروع
        run: npm ci

      - name: بناء الموقع (Vite)
        run: npm run build

      - name: إضافة منصة أندرويد (تتولّد من جديد كل مرة، ما بتترفع عالريبو)
        run: npx cap add android

      - name: إضافة ملف Firebase (google-services.json) من سر GitHub
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # مجلد android/ بيتولّد من الصفر كل بناء، فأي تعديل على الكود
      # النيتف لازم ينحط من جديد هون — نفس منطق colors.xml تحت.
      - name: تركيب MainActivity المعدّل (سقف تكبير خط النظام)
        run: cp android-src/MainActivity.java android/app/src/main/java/com/kanaanshop/app/MainActivity.java

      - name: إضافة ألوان الهوية الأساسية (colorPrimary/colorAccent) — ثيم أندرويد الافتراضي بيحتاجها
        run: |
          cat > android/app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#FF4522</color>
              <color name="colorPrimaryDark">#CC3419</color>
              <color name="colorAccent">#12B3A0</color>
          </resources>
          EOF

      - name: توليد الأيقونة وشاشة splash من مصادرها بمجلد assets/
        run: npx capacitor-assets generate --android

      - name: مزامنة Capacitor مع مجلد أندرويد
        run: npx cap sync android

      # مهم جداً: مجلد android/ بيتولّد من جديد كل بناء، فرقم الإصدار
      # بيرجع دايماً 1. Google Play بترفض أي رفعة برقم إصدار مستخدم من
      # قبل — يعني بلا هالخطوة، أول تحديث بعد الإطلاق ما رح تقدر ترفعه.
      # هون منحقن الرقم يلي بتدخلو وقت تشغيل الـ workflow يدوياً.
      - name: ضبط رقم إصدار التطبيق (versionCode / versionName)
        run: |
          VC="${{ inputs.version_code || '1' }}"
          VN="${{ inputs.version_name || '1.0' }}"
          sed -i "s/versionCode 1/versionCode $VC/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VN\"/" android/app/build.gradle
          echo "تم الضبط: versionCode=$VC versionName=$VN"
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: صلاحية تشغيل gradlew
        run: chmod +x android/gradlew

      - name: بناء الـ APK (نسخة تجريبية/debug)
        run: |
          cd android
          ./gradlew assembleDebug

      - name: رفع الـ APK كملف جاهز للتنزيل
        uses: actions/upload-artifact@v4
        with:
          name: kanaan-shop-debug-apk
          path: kanaan-shop-v3-admin/kanaan-site/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: إعادة بناء ملف مفتاح التوقيع من سر GitHub (لنسخة Google Play الرسمية)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/kanaan-release-key.jks

      - name: بناء نسخة release موقّعة (AAB) — لرفعها على Google Play
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/kanaan-shop-v3-admin/kanaan-site/android/app/kanaan-release-key.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: رفع ملف الـ AAB الجاهز لـ Google Play
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: kanaan-shop-release-aab
          path: kanaan-shop-v3-admin/kanaan-site/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
